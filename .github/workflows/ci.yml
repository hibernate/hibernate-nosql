name: CI

on:
  push:
    branches:
      # Pattern order matters: the last matching inclusion/exclusion wins
      - 'main'
      # We don't want to run CI on branches for dependabot, just on the PR.
      - '!dependabot/**'
  pull_request:
    branches:
      - 'main'
      # Ignore dependabot PRs that are not just about build dependencies or workflows;
      # we'll reject such PRs and send one ourselves.
      - '!dependabot/**'
      - 'dependabot/maven/build-dependencies-**'
      - 'dependabot/github_actions/workflow-actions-**'
  workflow_dispatch:

permissions: { }

# See https://github.com/hibernate/hibernate-orm/pull/4615 for a description of the behavior we're getting.
concurrency:
  # Consider that two builds are in the same concurrency group (cannot run concurrently)
  # if they use the same workflow and are about the same branch ("ref") or pull request.
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}"
  # Cancel previous builds in the same concurrency group even if they are in progress
  # for pull requests or pushes to forks (not the upstream repository).
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.repository != 'hibernate/hibernate-nosql' }}

jobs:

  # --- Main build + test matrix (reusable workflow) ---
  # Initial build compiles sources and renders docs; test matrix entries run in parallel after.

  build:
    # Skip push builds on forks for the main branch;
    # this avoids duplicate CI when syncing the fork, since the upstream repo already runs CI on push to main.
    if: github.repository == 'hibernate/hibernate-nosql' || !endsWith(github.ref, '/main')
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      initial-build-runs-on: "runs-on/fleet=linux-standard/env=ibm"
      # --- Databases ---
      # h2 is a sanity check for the compilation and the ORM-based implementation.
      # neo4j tests the graph database integration.
      # milvus tests the vector database integration (two versions).
      #
      # --- JDKs ---
      # We generally build with JDK 25, but our baseline is Java 17,
      # so we test with JDK 17, to be sure everything works.
      # We also verify that the project compiles with JDK 17 (JDK 17 build).
      # We want to enable preview features when testing newer builds of OpenJDK:
      # even if we don't use these features, just enabling them can cause
      # side effects and it's useful to test that.
      matrix-json: >-
        [
          { "name": "h2" },
          { "name": "neo4j", "rdbms": "neo4j",
            "runs-on": "runs-on/fleet=linux-standard/env=ibm" },
          { "name": "milvus 2.6", "rdbms": "milvus_2_6",
            "runs-on": "runs-on/fleet=linux-standard/env=ibm" },
          { "name": "milvus 3.0", "rdbms": "milvus_3_0",
            "runs-on": "runs-on/fleet=linux-standard/env=ibm" },
          { "name": "JDK", "java-test-version": "17",
            "runs-on": "runs-on/fleet=linux-standard/env=commonhaus" },
          { "name": "JDK", "java-test-version": "21",
            "runs-on": "runs-on/fleet=linux-standard/env=commonhaus" },
          { "name": "JDK", "java-test-version": "26",
            "java-launcher-args": "--enable-preview --illegal-final-field-mutation=deny",
            "runs-on": "runs-on/fleet=linux-standard/env=commonhaus" },
          { "name": "JDK 17 build", "java-build-version": "17",
            "gradle-args": "-PskipErrorProne=true -x test",
            "runs-on": "runs-on/fleet=linux-standard/env=commonhaus" }
          ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'jdk') || contains(github.event.pull_request.labels.*.name, 'jdk-27')) && ', { "name": "JDK", "java-test-version": "27", "java-launcher-args": "--enable-preview --illegal-final-field-mutation=deny", "gradle-args": "-PskipJacoco=true" }' || '' }}
          ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'jdk') || contains(github.event.pull_request.labels.*.name, 'jdk-28')) && ', { "name": "JDK", "java-test-version": "28", "java-test-from": "jdk.java.net", "java-launcher-args": "--enable-preview --illegal-final-field-mutation=deny -Dnet.bytebuddy.experimental=true", "gradle-args": "-PskipJacoco=true" }' || '' }}
        ]
      run-sonar: true
    secrets: inherit
