services:
  neo4j:
    container_name: neo4j
    image: ${NEO4J_IMAGE:-docker.io/neo4j:2026.10.0-community@sha256:388c0e5c6d4543e3d0e6cee3d1e751c05ad9314aa73342cc63cd0ea0946e38bb}
    environment:
      - NEO4J_AUTH=neo4j/hibernate_orm_test
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc-extended"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.\*
      - NEO4J_db_lock_acquisition_timeout=10s
    ports:
      - "7474:7474"
      - "7687:7687"